services:
  - type: web
    name: business-money-tracker
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: JWT_SECRET
        generateValue: true
      - key: REGISTRATION_CODE
        generateValue: true
    disk:
      name: business-money-data
      mountPath: /var/data
      sizeGB: 1
